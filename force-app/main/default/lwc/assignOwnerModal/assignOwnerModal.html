<template>
    <lightning-modal-header label="Assign new owner"></lightning-modal-header>
    <lightning-modal-body>
        <lightning-record-picker
            label="New owner"
            placeholder="Search users..."
            object-api-name="User"
            onchange={handleChange}>
        </lightning-record-picker>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
        <lightning-button variant="brand" label="Assign"
            disabled={assignDisabled} onclick={handleAssign}></lightning-button>
    </lightning-modal-footer>
</template>
